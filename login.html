<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RxStock | Sign In</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" referrerpolicy="no-referrer" />
</head>
<body>

    <div class="login-wrap">
        <div class="login-card">
            <div style="text-align:center; margin-bottom:8px;">
                <div class="brand-logo" style="width:84px;height:84px;margin:auto;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:32px;color:white;">
                    <i class="fa-solid fa-capsules"></i>
                </div>
                <h1 style="margin:14px 0 6px;font-size:26px;font-weight:800;">Welcome Back</h1>
                <p class="sub">Sign in to access your pharmacy dashboard</p>
            </div>

            <form id="login-form">
                <div class="field">
                    <label for="email" class="required">Email Address</label>
                    <input type="email" id="email" placeholder="you@pharmacy.com" autocomplete="username" required />
                </div>

                <div class="field">
                    <label for="password" class="required">Password</label>
                    <div style="position:relative;">
                        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required />
                        <button type="button" id="togglePassword" style="position:absolute;top:50%;right:12px;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted-2);font-size:16px;"><i class="fa-regular fa-eye"></i></button>
                    </div>
                </div>

                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:14px;">
                    <label style="display:flex;align-items:center;gap:8px;margin:0;"><input type="checkbox" id="remember"/> Remember Me</label>
                    <a href="#" style="color:var(--muted-2);text-decoration:none;font-weight:600;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
                    <span class="btn-icon"><i class="fa-solid fa-right-to-bracket"></i></span>
                    Sign In
                </button>

                <p id="error" class="error-text" style="display:none;"></p>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="ui.js"></script>
    <script src="utils.js"></script>
    <script src="login.js"></script>

</body>
</html>
